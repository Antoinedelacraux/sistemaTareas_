    <!-- Top Header & Brand -->
    <header class="app-header">
        <div class="brand-section">
            <div class="brand-logo-pill">TAL</div>
            <div class="brand-meta">
                <h1 class="brand-title">Planeamiento — Sistema de Tareas</h1>
                <span class="brand-subtitle">TAL S.A. &bull; Gestión Operativa</span>
            </div>
        </div>
        <div class="header-actions">
            <!-- Indicador de Usuario Activo -->
            <div id="user-profile-container" style="display: none;">
                <div class="user-profile-badge">
                    <div id="user-avatar" class="user-avatar" aria-hidden="true">?</div>
                    <div class="user-details">
                        <span id="user-name" class="user-name">Cargando...</span>
                        <span id="user-role" class="user-role-label">...</span>
                    </div>
                </div>
            </div>

            <!-- Campana de Notificaciones Idempotentes (MVP-08) -->
            <div id="notifications-menu-container" class="notifications-wrapper" style="display: none;">
                <button id="notif-bell-btn" class="btn btn-outline btn-sm notif-bell-btn" title="Notificaciones" aria-label="Notificaciones del sistema" aria-expanded="false">
                    <svg class="icon-svg" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <span id="notif-badge" class="notif-badge" style="display: none;">0</span>
                </button>
                <div id="notif-dropdown" class="notif-dropdown" style="display: none;" role="region" aria-label="Bandeja de notificaciones">
                    <div class="notif-dropdown-header">
                        <div class="notif-title-group">
                            <svg class="icon-svg icon-svg-sm" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                            <span class="notif-dropdown-title">Notificaciones</span>
                        </div>
                        <button id="notif-mark-all-btn" class="notif-mark-all-btn" title="Marcar todas como leídas">Marcar todas leídas</button>
                    </div>
                    <div id="notif-items-list" class="notif-items-list">
                        <div class="notif-empty-state">No tienes notificaciones pendientes</div>
                    </div>
                </div>
            </div>

            <button id="theme-toggle-btn" class="btn btn-outline btn-sm" aria-label="Cambiar entre modo claro y modo oscuro">
                <span id="theme-icon" aria-hidden="true" class="theme-icon-slot">
                    <svg class="icon-svg" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </span>
                <span id="theme-text">Modo</span>
            </button>

            <button id="logout-btn" class="btn btn-outline btn-sm" style="display: none;" aria-label="Cerrar sesión activa">
                <svg class="icon-svg" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                <span>Salir</span>
            </button>
        </div>
    </header>
