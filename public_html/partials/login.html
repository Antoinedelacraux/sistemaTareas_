    <!-- Contenedor Principal SPA -->
    <main class="main-content">
        <!-- Vista de Login Directa: Imagen al Costado + Bienvenida + Formulario + Cuentas Demo -->
        <div id="login-view" class="login-view-container" style="display: flex;">
            <div class="login-card-clean">
                <!-- Columna Izquierda: Imagen Corporativa TAL S.A. -->
                <div class="login-image-column">
                    <img src="./assets/img/login_hero.jpg" alt="TAL S.A. Planeamiento" class="login-hero-image" />
                    <div class="login-image-overlay">
                        <div class="login-overlay-brand">
                            <span class="login-overlay-logo">TAL S.A.</span>
                            <span class="login-overlay-area">Área de Planeamiento</span>
                        </div>
                        <p class="login-overlay-desc">Plataforma Integral de Seguimiento y Gestión Operativa de Tareas</p>
                    </div>
                </div>

                <!-- Columna Derecha: Formulario de Acceso y Demostración -->
                <div class="login-form-column">
                    <div class="login-form-header">
                        <div class="login-brand-badge">TAL PLANEAMIENTO</div>
                        <h1 class="login-title">¡Bienvenido!</h1>
                        <p class="login-subtitle">Ingresa tus credenciales para acceder a tu espacio de trabajo</p>
                    </div>

                    <form id="login-form" class="login-form-body" novalidate>
                        <div class="form-group">
                            <label class="form-label" for="login-email">Correo Electrónico</label>
                            <div class="input-with-icon">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                                <input type="email" id="login-email" class="form-input" required autocomplete="username" placeholder="mchumbes@planeamiento.tal" value="mchumbes@planeamiento.tal" aria-label="Correo institucional">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="login-password">Contraseña</label>
                            <div class="input-with-icon">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                <input type="password" id="login-password" class="form-input" required autocomplete="current-password" placeholder="Contraseña de acceso" value="Planeamiento2026!" aria-label="Contraseña">
                            </div>
                        </div>

                        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-login-action">
                            <span>Ingresar al Sistema</span>
                            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                        </button>
                    </form>

                    <!-- Accesos Rápidos de Demostración -->
                    <div class="login-demo-section">
                        <div class="login-demo-divider">
                            <span>O ingresa directamente con una cuenta de prueba:</span>
                        </div>
                        <div class="login-demo-buttons">
                            <button type="button" class="btn-demo-account" onclick="quickLogin('mchumbes@planeamiento.tal')">
                                <span class="demo-avatar avatar-asistente">MC</span>
                                <div class="demo-info">
                                    <span class="demo-name">Marco Chumbes</span>
                                    <span class="demo-role">Asistente Operativo</span>
                                </div>
                                <svg class="demo-arrow" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </button>

                            <button type="button" class="btn-demo-account" onclick="quickLogin('jefe.planeamiento@planeamiento.tal')">
                                <span class="demo-avatar avatar-jefe">EV</span>
                                <div class="demo-info">
                                    <span class="demo-name">Elena Vega</span>
                                    <span class="demo-role">Jefa de Planeamiento</span>
                                </div>
                                <svg class="demo-arrow" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </button>

                            <button type="button" class="btn-demo-account" onclick="quickLogin('jefe.personal@planeamiento.tal')">
                                <span class="demo-avatar avatar-personal">RS</span>
                                <div class="demo-info">
                                    <span class="demo-name">Roberto Sánchez</span>
                                    <span class="demo-role">Jefe de Personal</span>
                                </div>
                                <svg class="demo-arrow" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
